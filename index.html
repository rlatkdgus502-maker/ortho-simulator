<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ortho Simulator</title>
<style>
body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#f5f7fa;color:#18212f}
header{background:#111827;color:white;padding:42px 24px}
header>div,main,footer{max-width:1000px;margin:auto}
h1{margin:0 0 8px;font-size:34px}.sub{color:#cbd5e1}
main{padding:28px 20px}.toolbar{display:flex;gap:10px;margin-bottom:20px}
input{flex:1;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:22px;box-shadow:0 3px 14px rgba(0,0,0,.06)}
.num{font-size:12px;color:#64748b;font-weight:700}.card h2{font-size:19px;margin:9px 0 18px}
a{display:inline-block;text-decoration:none;background:#2563eb;color:white;padding:10px 16px;border-radius:9px;font-weight:700}
.status{padding:18px;background:white;border-radius:12px;border:1px solid #e5e7eb;color:#64748b}
footer{padding:5px 20px 35px;color:#64748b;font-size:12px}
</style>
</head>
<body>
<header><div><h1>ORTHO SIMULATOR</h1><div class="sub">Interactive Orthopaedic Education</div></div></header>
<main>
<div class="toolbar"><input id="search" placeholder="Search simulators..."></div>
<div id="status" class="status">GitHub에서 simulator 목록을 불러오는 중입니다...</div>
<div id="grid" class="grid"></div>
</main>
<footer>For orthopaedic education. Not intended as a clinical decision-support system.</footer>

<script>
const OWNER="rlatkdgus502-maker";
const REPO="ortho-simulator";
const API=`https://api.github.com/repos/${OWNER}/${REPO}/contents/`;
let items=[];

function prettify(filename){
  return filename
    .replace(/\.html$/i,"")
    .replace(/^Ortho_Simulator_/i,"")
    .replace(/^(\d+)[_-]?/,"")
    .replace(/[_-]+/g," ")
    .replace(/\b\w/g,c=>c.toUpperCase());
}
function numberOf(filename){
  const m=filename.match(/(?:Ortho_Simulator_)?(\d+)/i);
  return m ? parseInt(m[1],10) : 9999;
}
function render(q=""){
  const grid=document.getElementById("grid");
  const status=document.getElementById("status");
  grid.innerHTML="";
  const filtered=items.filter(x=>x.name.toLowerCase().includes(q.toLowerCase()));
  status.style.display=filtered.length ? "none":"block";
  if(!filtered.length) status.textContent=q ? "검색 결과가 없습니다." : "Simulator HTML 파일이 없습니다.";
  filtered.forEach(x=>{
    const n=numberOf(x.name);
    const card=document.createElement("section");
    card.className="card";
    card.innerHTML=`
      <div class="num">${n===9999 ? "SIMULATOR" : "SIMULATOR #"+String(n).padStart(2,"0")}</div>
      <h2>${prettify(x.name)}</h2>
      <a href="${encodeURI(x.name)}">OPEN SIMULATOR</a>`;
    grid.appendChild(card);
  });
}
fetch(API,{headers:{"Accept":"application/vnd.github+json"}})
 .then(r=>{if(!r.ok) throw new Error("GitHub API error"); return r.json();})
 .then(data=>{
   items=data.filter(x =>
      x.type==="file" &&
      /\.html$/i.test(x.name) &&
      x.name.toLowerCase()!=="index.html"
   ).sort((a,b)=>numberOf(a.name)-numberOf(b.name) || a.name.localeCompare(b.name));
   render();
 })
 .catch(()=>{
   const s=document.getElementById("status");
   s.textContent="목록을 불러오지 못했습니다. 잠시 후 새로고침하십시오.";
 });
document.getElementById("search").addEventListener("input",e=>render(e.target.value));
</script>
</body>
</html>
